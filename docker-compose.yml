services:
  postgres:
    image: postgres:16
    container_name: claimlens-postgres
    environment:
      POSTGRES_USER: claimlens
      POSTGRES_PASSWORD: claimlens
      POSTGRES_DB: claimlens
    ports:
      - "5432:5432"
    volumes:
      - claimlens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimlens -d claimlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  claimlens-postgres-data:
