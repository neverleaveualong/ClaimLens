[project]
name = "claimlens-api"
version = "0.1.0"
description = "FastAPI and LangGraph backend for ClaimLens."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.1.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "qdrant-client>=1.10.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"
